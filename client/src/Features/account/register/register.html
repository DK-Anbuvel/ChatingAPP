<div class="card bg-base-100 w-1/2 mx-auto flex flex-col p-6 rounded-lg shadow-lg">
    <div class="card-title justify-center text-3xl text-primary">sign up</div>
<div class="card-body w-full">
 <ul class="steps">
  <li class="step step-primary">Credentials</li>
    <li class="step" [class.step-primary]="currentStep()===2">Profile</li>
 </ul>
  @if(currentStep() ===1){
    <!-- <form #registerForm="ngForm" class="flex flex-col gap-4 w-full" (ngSubmit)="register()">
        <input class="input w-full" name="email"
          [(ngModel)]="creds.email" placeholder="Email">
           <input class="input w-full" name="displayName"
          [(ngModel)]="creds.displayName" placeholder="display Name">
           <input class="input w-full" name="password"
          [(ngModel)]="creds.password" placeholder="Password"> -->

              <form [formGroup]="credentialForm" class="flex flex-col gap-4 w-full steps" >
            <app-text-input class="m-2" label="Email" formControlName="email"/>
          <app-text-input label="Display Name" formControlName="displayName"/>
              <app-text-input label="Password" formControlName="password" type="password"/>
                  <app-text-input label="Confirm Password" formControlName="confirmPassword" type="password"/>

<!-- 
          <label class="floating-label">
            <span>Password</span>
             <input class="input w-full" formControlName="password"
            placeholder="Password">
         </label>
         <label class="floating-label">
            <span>Confirm Password</span>
             <input class="input w-full" formControlName="confirmPassword"
            placeholder="Confirm Password">
         </label> -->
              
         <!-- <select class="select w-full"> 
            <option disable selected>pick a member</option>
            @for(member of membersFromHome();track $index){
                <option value="{{member.id}}">{{member.displayName}}</option>
            }
          </select>-->
          <div class="flex items-center justify-end gap-3">
            <button (click)="cancel()" class="btn">Cancel</button>
            <button (click)="nextStep()" [disabled]="!credentialForm.valid" class="btn btn-primary" type="button">Next</button>
          </div>

    </form>
  }

  @if(currentStep() ===2){
    <form [formGroup] ="profileForm" class="flex flex-col w-full gap-4 steps ">

     <div>Profile form goes here</div>
       <div class="flex items-center justify-end gap-3">
            <button (click)="prevStep()" class="btn">Back</button>
            <button [disabled]="!profileForm.valid" (click)="register()" [disabled]="!credentialForm.valid" class="btn btn-primary" type="button">Register</button>
          </div>
    </form>
  }
</div>

          <div class="flex flex-col items-start px-3 w-full mockup-code text-lg">
            <div>Creds value:{{credentialForm.value |json}}</div>
            <div>Creds status:{{credentialForm.status |json}}</div>
            <div>profile value:{{profileForm.value |json}}</div>
            <div>profile status:{{profileForm.status |json}}</div>
          </div>

</div>
